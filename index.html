<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom, #1a001a, #ffccd5);
  color:#333;
  text-align:center;
}

/* top header */
.header {
  padding:40px 20px 20px;
  color:white;
}

.header h1 {
  font-family:cursive;
  font-size:32px;
  text-shadow:0 0 10px rgba(255,255,255,0.6);
}

/* main card */
.card {
  background:#ffd6e0;
  margin:20px;
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* images */
.img {
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  margin:10px;
  box-shadow:0 0 15px rgba(255,105,180,0.6);
}

/* heart */
.heart {
  font-size:28px;
  margin:10px 0;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.2);}
  100% {transform:scale(1);}
}

/* text */
.text {
  font-size:16px;
  line-height:1.6;
  margin-top:10px;
}

/* button */
button {
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
}

/* hidden sections */
.section {
  display:none;
  animation: fade 0.8s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="header">
  <h1>A little note for you ❤️</h1>
</div>

<div class="card">

  <!-- first visible -->
  <div id="s1" class="section" style="display:block;">
    <img src="Screenshot_20260329-233056.png" class="img">
    <div class="heart">💖</div>
    <div class="text">
      I don’t know what’s going on…  
      but I just want you to know one thing…
    </div>
    <button onclick="next(1)">Tap 💌</button>
  </div>

  <!-- second -->
  <div id="s2" class="section">
    <div class="text">
      I’m still here ❤️  
      I didn’t go anywhere…
    </div>
    <button onclick="next(2)">Tap 💌</button>
  </div>

  <!-- third -->
  <div id="s3" class="section">
    <div class="text">
      You don’t have to explain anything…  
      just be okay 🥺
    </div>
    <button onclick="next(3)">Tap 💌</button>
  </div>

  <!-- fourth -->
  <div id="s4" class="section">
    <div class="text">
      Haal mat chorna bachha ❤️  
      I’m always with you 🐼
    </div>
    <button onclick="next(4)">Tap 💌</button>
  </div>

  <!-- final -->
  <div id="s5" class="section">
    <img src="Screenshot_20260329-233056.png" class="img">
    <img src="Screenshot_20260329-233056.png" class="img">
    <div class="text">
      I miss you 🥺  
      Take your time…  
      I’ll be right here ❤️
    </div>
  </div>

</div>

<script>
function next(n){
  document.getElementById("s"+n).style.display="none";
  document.getElementById("s"+(n+1)).style.display="block";
}
</script>

</body>
</html>
