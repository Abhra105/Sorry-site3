<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:black;
}

/* cinematic blurred background */
.bg {
  position:fixed;
  width:100%;
  height:100%;
  background:url('photo1.jpg') center/cover no-repeat;
  filter: blur(20px) brightness(0.6);
  transform: scale(1.2);
}

/* glass card */
.card {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:85%;
  max-width:340px;
  padding:25px;
  border-radius:25px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  color:white;
  text-align:center;
  box-shadow:0 0 40px rgba(255,105,180,0.5);
}

/* glowing text */
h3 {
  color:#ff99cc;
  text-shadow:0 0 10px #ff4d6d;
}

/* buttons */
button {
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
}

/* floating hearts */
.heart {
  position:absolute;
  font-size:18px;
  animation: float 6s linear infinite;
}
@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}

/* panda */
.panda {
  position:absolute;
  width:60px;
  animation: bounce 3s infinite;
}
@keyframes bounce {
  50% {transform: translateY(-10px);}
}

/* final photo glow */
.final-img {
  width:100%;
  border-radius:20px;
  margin-top:10px;
  opacity:0;
  animation: fadeIn 2s forwards;
  box-shadow:0 0 30px #ff99cc;
}

@keyframes fadeIn {
  to {opacity:1;}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- hearts -->
<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:30%; animation-delay:1s;">💖</div>
<div class="heart" style="left:50%; animation-delay:2s;">💕</div>
<div class="heart" style="left:70%; animation-delay:3s;">💗</div>
<div class="heart" style="left:90%; animation-delay:4s;">💓</div>

<!-- panda -->
<img class="panda" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" style="bottom:10%; left:5%;">
<img class="panda" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" style="bottom:15%; right:5%;">

<div class="card" id="card">
<h3>Sripuu Sonaa Butkii Puchkii 🐼❤️</h3>
<p id="msg">Tap me...</p>

<button onclick="next()">Tap 💌</button>
<button id="noBtn" onmouseover="moveNo()">No 😤</button>
</div>

<audio id="music" loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<script>
let step = 0;
const msg = document.getElementById("msg");

function next(){
step++;

if(step===1){
msg.innerHTML="I don’t know what’s going on…";
}
else if(step===2){
msg.innerHTML="But I’m still here ❤️";
}
else if(step===3){
msg.innerHTML="You don’t have to explain anything…";
}
else if(step===4){
msg.innerHTML="Just be okay 🥺";
}
else if(step===5){
msg.innerHTML="Haal mat chorna bachha ❤️";
}
else if(step===6){
finalScreen();
}
}

function moveNo(){
let btn=document.getElementById("noBtn");
btn.style.position="absolute";
btn.style.top=Math.random()*80+"%";
btn.style.left=Math.random()*80+"%";
}

function finalScreen(){
let card=document.getElementById("card");

card.innerHTML = `
<h2 style="color:#ff99cc;">Just this… ❤️</h2>
<p>I miss you 🥺<br><br>I’ll be here… always 🐼</p>

<img src="photo1.jpg" class="final-img">
<img src="photo2.jpg" class="final-img" style="margin-top:15px; animation-delay:1s;">
`;
}

/* music start */
document.body.addEventListener('click', function(){
document.getElementById("music").play();
},{once:true});
</script>

</body>
</html>
